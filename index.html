<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Profile | Nguyễn Quốc Thái</title>
    <meta charset="utf-8">
    <style>
        body {
            background-color: #0f172a;  
            color: #e2e8f0;  
            text-align: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        h1 {
            color: #f8fafc;
            margin-bottom: 5px;
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .class-tag {
            font-size: 16px;
            color: #38bdf8; 
            font-weight: 600;
            margin-bottom: 20px;
            display: block;
        }

        img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            display: block;
            margin: 0 auto 25px;
            border: 3px solid #38bdf8;
            border-radius: 50%;
           
        }

        .info-section {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        p {
            font-size: 15px;
            margin: 8px 0;
            color: #94a3b8;
        }

        strong {
            color: #f1f5f9;
        }

       
        .btn-github {
            display: block;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 10px;
        
        }
        
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>Nguyễn Quốc Thái</h1>
        <span class="class-tag">Lớp: DA24TTA</span>

        <img src="asset/avt67.jpg" alt="Avatar">

        <div class="info-section">
            <p>📍 <strong>Trà Vinh, Việt Nam</strong></p>
            <p>🎮 <strong>Sở thích:</strong> Chơi game giải trí</p>
            <p>🎬 <strong>Kỹ năng:</strong> Edit video dạo</p>
            <p>🐱 <strong>Động vật yêu thích:</strong> Mèo</p>
        </div>

        <a href="https://github.com/ThaiNguyen0" target="_blank" class="btn-github">GitHub</a>
        
        <a href="#" target="_blank" class="btn-github" style="background: #1877F2;">Facebook</a>
        
        <p style="margin-top: 20px; font-size: 12px; opacity: 0.5;">
            Sinh viên CNTT  Đại học Trà Vinh
        </p>
    </div>

</body>
</html>
